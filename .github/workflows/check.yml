name: Check application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/check_content.py
      - run: python tools/check_transformer_numbers.py
      - run: node tools/qa.cjs --core-only
      - run: node tools/qa_math.cjs --formulas-only
      - run: node --check dist/app.js
      - run: node --check dist/themes.js
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.5.4 scipy==1.18.1 opencv-python-headless==5.0.0.93
      - run: python tools/check_math_examples.py
