name: Check application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/check_content.py
      - run: python tools/check_transformer_numbers.py
      - run: node tools/qa.cjs --core-only
      - run: node tools/qa_math.cjs --formulas-only
      - run: node tools/qa_diagrams.cjs --layout-only
      - run: node --check dist/diagrams.js
      - run: node --check dist/app.js
      - run: node --check dist/themes.js
      - run: node --check dist/study.js
      - run: node --check dist/code-practice.js
      - run: node --check dist/training-tools.js
      - run: node tools/qa_tools.cjs --core-only
      - run: node tools/qa_code.cjs --core-only
      - run: node tools/qa_study.cjs --core-only
      - run: python tools/package_hosting.py
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6 scipy==1.18.1 opencv-python-headless==4.11.0.86
      - run: python tools/check_math_examples.py
      - run: python tools/check_code_bank.py
  training-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r tools/training-tools-requirements.txt
      - run: python tools/check_training_tools.py
  deploy:
    needs: [check, examples, training-tools]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://cv-training.web.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global firebase-tools@15.26.0
      - run: python tools/package_hosting.py
      - uses: google-github-actions/auth@v3
        with:
          project_id: cv-training-practice-mipt
          workload_identity_provider: projects/778660595993/locations/global/workloadIdentityPools/github/providers/cv-practice
          service_account: github-hosting@cv-training-practice-mipt.iam.gserviceaccount.com
      - name: Publish to Firebase Hosting
        run: firebase deploy --only hosting:practice --project cv-training-practice-mipt --non-interactive --message "$GITHUB_SHA"
